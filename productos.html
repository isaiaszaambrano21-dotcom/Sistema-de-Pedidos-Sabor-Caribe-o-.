<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Sabor Caribeño</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sabor Caribeño</h1>
        <div class="perfil-usuario">
            <img src="logo.png" alt="Logo">
            <div class="info-user">
                <p><strong id="nombre-header">Cargando...</strong></p>
                <small id="rol-header">—</small>
            </div>
        </div>
        <nav>
            <ul id="nav-menu"></ul>
        </nav>
        <button onclick="Auth.cerrar()"
            style="margin-top:20px; background:#ef4444; color:white; border:none;
                   padding:12px; border-radius:14px; font-weight:700; cursor:pointer; width:100%;">
            Cerrar sesión
        </button>
    </header>

    <main>

        <div class="card">

            <div style="display:flex; justify-content:space-between; align-items:center;
                        margin-bottom:16px; flex-wrap:wrap; gap:10px;">
                <h2>Platillos Panameños</h2>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button onclick="filtrarDisponibilidad('todos')" id="btn-todos"
                        style="padding:7px 14px; border-radius:20px; border:2px solid #3b82f6;
                               background:#3b82f6; color:white; cursor:pointer; font-size:0.82rem; font-weight:600;">
                        Todos
                    </button>
                    <button onclick="filtrarDisponibilidad('disponible')" id="btn-disponible"
                        style="padding:7px 14px; border-radius:20px; border:2px solid #22c55e;
                               background:white; color:#22c55e; cursor:pointer; font-size:0.82rem; font-weight:600;">
                        ✓ Disponibles
                    </button>
                    <button onclick="filtrarDisponibilidad('agotado')" id="btn-agotado"
                        style="padding:7px 14px; border-radius:20px; border:2px solid #ef4444;
                               background:white; color:#ef4444; cursor:pointer; font-size:0.82rem; font-weight:600;">
                        ✗ Agotados
                    </button>
                </div>
            </div>

            <input type="text" id="buscador" placeholder="🔍 Buscar platillo..."
                   oninput="filtrar()" style="margin-bottom:8px;">

            <p id="contador" style="font-size:0.82rem; color:#6b7280; margin-bottom:14px;"></p>

            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Plato</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Disponibilidad</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
            </div>

        </div>

    </main>

    <script src="auth.js"></script>
    <script>
        const usuario = Auth.requerir('gerente', 'administrador', 'mesero', 'cocinero');
        if (!usuario) throw new Error('Sin acceso');

        Auth.mostrarUsuario();
        const rol = usuario.rol;

        // Cocinero, gerente y admin pueden cambiar disponibilidad
        const puedeEditar = ['gerente', 'administrador', 'cocinero'].includes(rol);

        // ── Menú según rol ──
        const menus = {
            gerente:       ['vision.html|Resumen','productos.html|Productos','ordenes.html|Órdenes','ajustes.html|Ajustes'],
            administrador: ['vision.html|Resumen','productos.html|Productos','ordenes.html|Órdenes','ajustes.html|Ajustes'],
            mesero:        ['nuevo-pedido.html|Nuevo Pedido','ordenes.html|Mis Órdenes','productos.html|Menú'],
            cocinero:      ['cocina.html|Cocina','productos.html|Menú']
        };

        document.getElementById('nav-menu').innerHTML = (menus[rol] || []).map(item => {
            const [href, label] = item.split('|');
            const active = location.pathname.endsWith(href) ? 'class="active"' : '';
            return `<li><a href="${href}" ${active}>${label}</a></li>`;
        }).join('');

        let todosLosProductos = [];
        let filtroBusqueda    = '';
        let filtroDisp        = 'todos';

        // ── Filtro por disponibilidad ──
        function filtrarDisponibilidad(tipo) {
            filtroDisp = tipo;

            const configs = {
                todos:      { id: 'btn-todos',      color: '#3b82f6' },
                disponible: { id: 'btn-disponible', color: '#22c55e' },
                agotado:    { id: 'btn-agotado',    color: '#ef4444' }
            };

            Object.entries(configs).forEach(([key, { id, color }]) => {
                const btn = document.getElementById(id);
                if (key === tipo) {
                    btn.style.background = color;
                    btn.style.color      = 'white';
                } else {
                    btn.style.background = 'white';
                    btn.style.color      = color;
                }
            });

            aplicarFiltros();
        }

        // ── Filtro por búsqueda ──
        function filtrar() {
            filtroBusqueda = document.getElementById('buscador').value.toLowerCase();
            aplicarFiltros();
        }

        // ── Aplicar ambos filtros ──
        function aplicarFiltros() {
            let resultado = todosLosProductos;

            if (filtroBusqueda) {
                resultado = resultado.filter(p =>
                    p.nombre.toLowerCase().includes(filtroBusqueda) ||
                    (p.categoria || '').toLowerCase().includes(filtroBusqueda)
                );
            }

            if (filtroDisp === 'disponible') {
                resultado = resultado.filter(p => p.disponible);
            } else if (filtroDisp === 'agotado') {
                resultado = resultado.filter(p => !p.disponible);
            }

            renderTabla(resultado);
        }

        // ── Renderizar tabla ──
        function renderTabla(productos) {
            const disponibles = todosLosProductos.filter(p => p.disponible).length;
            const agotados    = todosLosProductos.length - disponibles;

            document.getElementById('contador').innerHTML =
                `Mostrando <strong>${productos.length}</strong> de <strong>${todosLosProductos.length}</strong> productos &nbsp;·&nbsp;
                 <span style="color:#22c55e;">✓ ${disponibles} disponibles</span> &nbsp;·&nbsp;
                 <span style="color:#ef4444;">✗ ${agotados} agotados</span>`;

            if (productos.length === 0) {
                document.getElementById('cuerpo-tabla').innerHTML = `
                    <tr><td colspan="5" style="text-align:center; padding:30px; color:#9ca3af;">
                        No se encontraron productos.
                    </td></tr>`;
                return;
            }

            document.getElementById('cuerpo-tabla').innerHTML = productos.map(p => {
                const dispColor = p.disponible ? '#22c55e' : '#ef4444';
                const dispBg    = p.disponible ? '#dcfce7' : '#fee2e2';
                const dispTexto = p.disponible ? '✓ Disponible' : '✗ Agotado';

                // Botón si puede editar, etiqueta si no
                const dispHTML = puedeEditar ? `
                    <button onclick="toggleDisponible('${p.id}', ${p.disponible})"
                        style="padding:7px 16px; border:none; border-radius:20px; cursor:pointer;
                               font-size:0.82rem; font-weight:700;
                               background:${dispBg}; color:${dispColor};
                               transition: opacity 0.2s;"
                        onmouseover="this.style.opacity='0.75'"
                        onmouseout="this.style.opacity='1'">
                        ${dispTexto}
                    </button>` : `
                    <span style="display:inline-block; padding:5px 14px; border-radius:20px;
                                 font-size:0.82rem; font-weight:700;
                                 background:${dispBg}; color:${dispColor};">
                        ${dispTexto}
                    </span>`;

                return `
                <tr style="transition:opacity 0.3s; ${p.disponible ? '' : 'opacity:0.6;'}">
                    <td>
                        <img src="${p.imagen}" alt="${p.nombre}"
                             onerror="this.src='logo.png'"
                             style="width:64px; height:52px; border-radius:10px; object-fit:cover;">
                    </td>
                    <td style="font-weight:600;">${p.nombre}</td>
                    <td>
                        <span style="background:#f1f5f9; color:#64748b; padding:3px 10px;
                                     border-radius:20px; font-size:0.78rem; font-weight:500;">
                            ${(p.categoria || 'otros').charAt(0).toUpperCase() + (p.categoria || 'otros').slice(1)}
                        </span>
                    </td>
                    <td style="font-weight:700; color:#ff512f;">B/.${parseFloat(p.precio).toFixed(2)}</td>
                    <td>${dispHTML}</td>
                </tr>`;
            }).join('');
        }

        // ── Cambiar disponibilidad ──
        async function toggleDisponible(id, actual) {
            const data = await Auth.fetch(`/api/productos/${id}`, {
                method: 'PATCH',
                body:   JSON.stringify({ disponible: !actual })
            });
            if (data && data.success) cargarProductos();
        }

        // ── Cargar productos ──
        async function cargarProductos() {
            const data = await Auth.fetch('/api/productos');
            if (!data || !data.success) return;
            todosLosProductos = data.productos;
            aplicarFiltros();
        }

        document.addEventListener('DOMContentLoaded', cargarProductos);
    </script>

</body>
</html>
