<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes - Sabor Caribeño</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sabor Caribeño</h1>
        <div class="perfil-usuario">
            <img src="logo.png" alt="Logo">
            <div class="info-user">
                <p><strong id="nombre-header">Cargando...</strong></p>
                <small id="rol-header">—</small>
            </div>
        </div>
        <nav>
            <ul id="nav-menu"></ul>
        </nav>
        <button onclick="Auth.cerrar()"
            style="margin-top:20px; background:#ef4444; color:white; border:none;
                   padding:12px; border-radius:14px; font-weight:700; cursor:pointer; width:100%;">
            Cerrar sesión
        </button>
    </header>

    <main>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
            <h2 id="titulo-pagina">Órdenes</h2>
            <span id="contador-badge"
                  style="background:#3b82f6; color:white; padding:6px 16px;
                         border-radius:20px; font-size:0.85rem; font-weight:600;">
                0 órdenes
            </span>
        </div>

        <div id="sin-ordenes"
             style="display:none; text-align:center; padding:50px 20px; color:#6b7280;">
            <p style="font-size:1.1rem; margin-bottom:10px;">No hay órdenes activas.</p>
            <a href="nuevo-pedido.html" style="color:#2563eb;">Registrar nuevo pedido</a>
        </div>

        <div id="contenedor-ordenes" style="display:grid; gap:18px;
             grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));"></div>

    </main>

    <a href="nuevo-pedido.html" class="btn-flotante" title="Nuevo Pedido">+</a>

    <script src="auth.js"></script>
    <script>
        // ── Verificar sesión ──
        const usuario = Auth.requerir('gerente', 'administrador', 'mesero', 'cocinero');
        if (!usuario) throw new Error('Sin acceso');

        Auth.mostrarUsuario();

        const rol = usuario.rol;

        // ── Menú según rol ──
        const menus = {
            gerente:       ['vision.html|Resumen', 'productos.html|Productos', 'ordenes.html|Órdenes', 'ajustes.html|Ajustes'],
            administrador: ['vision.html|Resumen', 'productos.html|Productos', 'ordenes.html|Órdenes', 'ajustes.html|Ajustes'],
            mesero:        ['nuevo-pedido.html|Nuevo Pedido', 'ordenes.html|Mis Órdenes', 'productos.html|Menú'],
            cocinero:      ['ordenes.html|Cocina', 'productos.html|Menú']
        };

        document.getElementById('nav-menu').innerHTML = (menus[rol] || []).map(item => {
            const [href, label] = item.split('|');
            const active = location.pathname.endsWith(href) ? 'class="active"' : '';
            return `<li><a href="${href}" ${active}>${label}</a></li>`;
        }).join('');

        // Título según rol
        document.getElementById('titulo-pagina').textContent =
            rol === 'cocinero' ? 'Cocina — Órdenes Activas' :
            rol === 'mesero'   ? 'Mis Pedidos' : 'Todas las Órdenes';

        // ── Colores por estado ──
        const COLORES = {
            'en-proceso': '#f59e0b',
            'preparando': '#3b82f6',
            'listo':      '#22c55e',
            'completado': '#9ca3af'
        };

        const ETIQUETAS = {
            'en-proceso': '🟡 En proceso',
            'preparando': '🔵 Preparando',
            'listo':      '✅ Listo para servir',
            'completado': '✓ Completado'
        };

        // ── Renderizar órdenes ──
        function renderOrdenes(pedidos) {
            const contenedor = document.getElementById('contenedor-ordenes');
            const sinOrdenes = document.getElementById('sin-ordenes');
            const badge      = document.getElementById('contador-badge');

            badge.textContent = `${pedidos.length} órdenes`;

            if (pedidos.length === 0) {
                sinOrdenes.style.display   = 'block';
                contenedor.style.display   = 'none';
                return;
            }

            sinOrdenes.style.display = 'none';
            contenedor.style.display = 'grid';

            contenedor.innerHTML = pedidos.map(p => {
                const color    = COLORES[p.estado]   || '#9ca3af';
                const etiqueta = ETIQUETAS[p.estado] || p.estado;
                const hora     = new Date(p.creado_en).toLocaleTimeString('es-PA', { hour: '2-digit', minute: '2-digit' });

                // Botones según rol
                let botones = '';

                if (rol === 'cocinero') {
                    if (p.estado === 'en-proceso') {
                        botones = `<button onclick="cambiarEstado('${p.id}','preparando')"
                            style="background:#3b82f6; color:white; padding:10px; border-radius:10px;
                                   border:none; cursor:pointer; font-weight:600; width:100%;">
                            🔵 Marcar Preparando
                        </button>`;
                    } else if (p.estado === 'preparando') {
                        botones = `<button onclick="cambiarEstado('${p.id}','listo')"
                            style="background:#22c55e; color:white; padding:10px; border-radius:10px;
                                   border:none; cursor:pointer; font-weight:600; width:100%;">
                            ✅ Marcar Listo
                        </button>`;
                    }
                }

                if (rol === 'mesero' && p.estado === 'listo') {
                    botones = `<button onclick="cambiarEstado('${p.id}','completado')"
                        style="background:#8b5cf6; color:white; padding:10px; border-radius:10px;
                               border:none; cursor:pointer; font-weight:600; width:100%;">
                        ✓ Pedido entregado
                    </button>`;
                }

                if (rol === 'administrador' || rol === 'gerente') {
                    botones = `
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            ${p.estado === 'en-proceso' ? `<button onclick="cambiarEstado('${p.id}','preparando')"
                                style="flex:1; background:#3b82f6; color:white; padding:9px; border-radius:10px;
                                       border:none; cursor:pointer; font-size:0.8rem; font-weight:600;">
                                🔵 Preparando
                            </button>` : ''}
                            ${p.estado === 'preparando' ? `<button onclick="cambiarEstado('${p.id}','listo')"
                                style="flex:1; background:#22c55e; color:white; padding:9px; border-radius:10px;
                                       border:none; cursor:pointer; font-size:0.8rem; font-weight:600;">
                                ✅ Listo
                            </button>` : ''}
                            ${p.estado === 'listo' ? `<button onclick="cambiarEstado('${p.id}','completado')"
                                style="flex:1; background:#8b5cf6; color:white; padding:9px; border-radius:10px;
                                       border:none; cursor:pointer; font-size:0.8rem; font-weight:600;">
                                ✓ Entregado
                            </button>` : ''}
                        </div>`;
                }

                return `
                <article class="card orden-card" style="border-left:5px solid ${color};">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                        <h3 style="font-size:1.1rem;">Mesa #${p.mesa}</h3>
                        <span style="font-size:0.75rem; color:#9ca3af;">${hora}</span>
                    </div>
                    <p style="font-weight:600; margin-bottom:4px;">${p.plato}</p>
                    <p style="font-size:0.85rem; color:#6b7280; margin-bottom:8px;">
                        ${p.notas || 'Sin notas especiales'}
                    </p>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="font-weight:700; color:#ff512f;">B/.${(p.precio||0).toFixed(2)}</span>
                        <span style="font-size:0.78rem; background:${color}22; color:${color};
                                     padding:4px 10px; border-radius:20px; font-weight:600;">
                            ${etiqueta}
                        </span>
                    </div>
                    ${p.mesero_nombre ? `<p style="font-size:0.78rem; color:#9ca3af; margin-bottom:10px;">
                        Mesero: ${p.mesero_nombre}</p>` : ''}
                    ${botones}
                </article>`;
            }).join('');
        }

        // ── Cambiar estado ──
        async function cambiarEstado(id, estado) {
            const data = await Auth.fetch(`/api/pedidos/${id}/estado`, {
                method: 'PATCH',
                body:   JSON.stringify({ estado })
            });
            if (data && data.success) cargarOrdenes();
        }

        // ── Cargar órdenes ──
        async function cargarOrdenes() {
            const data = await Auth.fetch('/api/pedidos');
            if (data && data.success) renderOrdenes(data.pedidos);
        }

        // ── WebSocket ──
        Notif.conectar();
        Notif.on('nuevo-pedido', () => cargarOrdenes());
        Notif.on('pedido-listo', () => cargarOrdenes());

        document.addEventListener('DOMContentLoaded', cargarOrdenes);
    </script>

</body>
</html>
